<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RBR Incassi">
<meta name="theme-color" content="#111111">
<title>Restaurant Business Revolution — Incassi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#111111; --navy2:#e30613; --gold:#e30613; --bg:#ffffff; --card:#ffffff;
  --ink:#111111; --muted:#6b7280; --line:#e5e5e5; --green:#1b7f3b; --red:#e30613;
  --lblue:#fdeaec; --lyellow:#f4f4f5;
  --brandred:#e30613; --brandblack:#111111;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
header{position:static;background:#221f1f;color:#fff;padding:8px 16px;
  display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .logo{display:flex;flex-direction:column;line-height:.98;font-weight:900;letter-spacing:.6px}
header .logo-img{height:44px;display:block;align-self:center}
header .logo span{font-size:11px;color:#fff}
header .logo .w3{color:var(--brandred)}
header .app-title{font-weight:800;font-size:15px;color:#fff;border-left:3px solid var(--brandred);
  padding-left:11px;letter-spacing:.3px;text-transform:uppercase}
header .badge{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.16);margin-left:auto}
header .badge.ok{background:var(--green)}
nav{position:sticky;top:0;z-index:29;background:#fff;border-bottom:1px solid var(--line);
  display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:none;padding:12px 16px;font-size:13px;font-weight:700;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
nav button.active{color:var(--brandblack);border-bottom-color:var(--brandred)}
main{padding:14px;max-width:1200px;margin:0 auto}
.view{display:none}.view.active{display:block}
h2{font-size:18px;margin:4px 0 12px;color:var(--brandblack);font-weight:800}
h3{font-size:14px;margin:18px 0 8px;color:var(--brandblack);text-transform:uppercase;letter-spacing:.4px;font-weight:800}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpi .val{font-size:22px;font-weight:800;margin-top:4px;color:var(--navy)}
.kpi .val.sm{font-size:17px}
.kpi.alert .val{color:var(--red)}
.kpi.good .val{color:var(--green)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:14px}
.filters label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
select,input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--navy2);border-color:var(--navy2)}
.tbl-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.ms{position:relative;width:100%}
.ms-box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.ms-box .car{color:var(--muted);font-size:11px}
.ms-panel{display:none;position:absolute;z-index:45;top:calc(100% + 3px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:280px;overflow:auto;padding:4px}
.ms.open .ms-panel{display:block}
.ms-panel label{display:flex;align-items:center;gap:8px;padding:7px 8px;font-size:13px;cursor:pointer;border-radius:6px}
.ms-panel label:hover{background:var(--lblue)}
.ms-panel input[type=checkbox]{width:auto}
.ms-panel .clr{color:var(--brandred);font-weight:700;padding:7px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--line);margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;position:sticky;top:0}
tbody tr:hover{background:var(--lblue)}
tr.sub td{background:var(--lyellow);font-weight:700}
tr.tot td{background:#eef2f8;font-weight:800}
.money.neg{color:var(--red)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.pill.si{background:#e3f4e4;color:var(--green)}.pill.no{background:#fde8e8;color:var(--red)}
.pill.attivo{background:#e3f4e4;color:var(--green)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:9px 14px;
  font-size:13px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.btn.gold{background:var(--brandred);color:#fff}.btn.ghost{background:#f0f0f0;color:var(--brandblack)}
.btn.danger{background:var(--brandred)}.btn.sm{padding:5px 10px;font-size:12px}
.tbl-wrap.freeze table th:first-child,.tbl-wrap.freeze table td:first-child{
  position:sticky;left:0;z-index:2;background:#fff;box-shadow:2px 0 5px rgba(0,0,0,.07)}
.tbl-wrap.freeze table thead th:first-child{background:var(--brandblack);z-index:3}
.tbl-wrap.freeze tbody tr:hover td:first-child{background:var(--lblue)}
.tbl-wrap.freeze tr.sub td:first-child{background:#f4f4f5}
.tbl-wrap.freeze tr.tot td:first-child{background:#ddebf7}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;
  justify-content:center;z-index:50;padding:20px;overflow-y:auto}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px;margin:auto}
.modal h3{margin-top:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.form-grid label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.infocard{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.infocard .it{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.infocard .it .k{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.infocard .it .v{font-size:14px;font-weight:600;margin-top:2px}
.note{font-size:12px;color:var(--muted);margin:6px 0 14px}
.hint{font-size:12px;color:var(--muted)}
.chart-box{position:relative;height:260px}
.tag{font-size:11px;color:var(--muted)}
.search{max-width:280px}
@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  header h1{font-size:13px}
  main{padding:10px}
}
</style>
</head>

<script>
/* ============================ DATI ============================ */
const SEED = {"clienti": [], "movimenti": [], "erogato": [], "liste": {"venditori": ["Lorenzo Rizzo", "Luciano Purpi", "Roberto Falcon"], "consulenti": ["Alessio Vettori", "Andrea Chirivi", "Da assegnare", "Gianni Mazzotta", "Leo Franco", "Marco Cuccaro", "Roberto Falcon"], "dts": ["Da assegnare", "Leo Franco", "Marco Cuccaro", "Roberto Falcon"], "percorsi": ["Academy virtuale", "Consulenza 12 mesi (40%)", "Consulenza 12 mesi (50%)", "Consulenza 24 mesi (50%)", "Consulenza 3K + 10%", "Consulenza 3K fisso", "Da definire", "Mastermind", "Mastermind 24 mesi", "Videolezioni Mastermind"], "stati": ["Attivo", "Concluso", "Da definire", "Fermato", "Non attivo", "Non partito"], "tipi": ["Venduto", "Fatturato", "Incassato", "Rimborso"], "riferimenti": ["Nuovo incasso (front end)", "Incasso ricorrente (back end)"], "statiPagamento": ["Pagata", "Parziale", "Non pagata", "Proforma"], "iva": 0.22}};
const LS_KEY = 'rbr_incassi_v1';
const GH_KEY = 'rbr_gh_cfg_v1';

let state = load();
function load(){
  try{const s=localStorage.getItem(LS_KEY);if(s)return JSON.parse(s);}catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function hashStr(s){let h=5381;s=String(s);for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);}
function ensureIds(){
  if(!state._deleted)state._deleted={clienti:{},movimenti:{},erogato:{}};
  ['clienti','movimenti','erogato'].forEach(k=>{if(!state._deleted[k])state._deleted[k]={};});
  if(state._listeMod==null)state._listeMod=Date.now();
  (state.clienti||[]).forEach(c=>{if(c._mod==null)c._mod=Date.now();});
  (state.movimenti||[]).forEach(m=>{if(!m._id)m._id='m'+hashStr([m.clienteId,m.data,m.tipo,m.importo,m.riferimento,m.rifFattura||'',m.note||''].join('|'));if(m._mod==null)m._mod=Date.now();});
  (state.erogato||[]).forEach(e=>{if(!e._id)e._id='e'+hashStr([e.clienteId,e.mese,e.erogato,e.consulente||'',e.moldPrec,e.moldMese].join('|'));if(e._mod==null)e._mod=Date.now();});
  if(!state._migrVend){ state.liste=state.liste||{}; state.liste.venditori=state.liste.venditori||[];
    ['Alessio Vettori','Nicola Marra'].forEach(v=>{if(!state.liste.venditori.includes(v))state.liste.venditori.push(v);});
    state.liste.venditori.sort(); state._migrVend=true; state._listeMod=Date.now(); }
  if(!state._migr2){ state.liste=state.liste||{};
    // Direttori tecnici: aggiungi Luciano Purpi + Roberto Falcon, togli Marco Cuccaro (i suoi clienti -> Da assegnare)
    state.clienti.forEach(c=>{if(c.direttoreTecnico==='Marco Cuccaro'){c.direttoreTecnico='Da assegnare';c._mod=Date.now();}});
    state.liste.dts=(state.liste.dts||[]).filter(x=>x!=='Marco Cuccaro');
    ['Da assegnare','Luciano Purpi','Roberto Falcon'].forEach(x=>{if(!state.liste.dts.includes(x))state.liste.dts.push(x);});
    state.liste.dts.sort();
    // Stati nuovi + rimappatura dei vecchi (Fermato resta Fermato)
    state.clienti.forEach(c=>{const s=(c.stato||'').toLowerCase().trim();
      let ns;
      if(s==='attivo')ns='Attivo e pagante';
      else if(s==='concluso')ns='Concluso';
      else if(s==='non partito')ns='Non partito';
      else if(s==='fermato')ns='Fermato';
      else if(s==='attivo e pagante'||s==='attivo non pagante')ns=c.stato;
      else ns='Da definire';   // Non attivo, vuoti -> da rivedere
      if(c.stato!==ns){c.stato=ns;c._mod=Date.now();}});
    state.liste.stati=['Attivo e pagante','Attivo non pagante','Non partito','Fermato','Concluso','Da definire'];
    // Percorsi: togli Academy virtuale dall'elenco
    state.liste.percorsi=(state.liste.percorsi||[]).filter(x=>x!=='Academy virtuale');
    state._migr2=true; state._listeMod=Date.now(); }
}

/* ============================ UTIL ============================ */
const IVA = ()=> (state.liste.iva ?? 0.22);
const fmtE0 = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtE2 = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN = new Intl.NumberFormat('it-IT',{maximumFractionDigits:0});
const pct = v=> (v==null||!isFinite(v))?'–':(v*100).toFixed(1).replace('.',',')+'%';
function money(v,dec){if(v==null||v===''||!isFinite(v))return '–';const f=dec?fmtE2:fmtE0;const s=f.format(v);return v<0?`<span class="money neg">${s}</span>`:s;}
const MONTHS=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function mkey(d){return d?String(d).slice(0,7):'';}            // 'YYYY-MM'
function mlabel(k){const[y,m]=k.split('-');return MONTHS[+m-1]+' '+y;}
function today(){return new Date();}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const isBack = p=> /Consulenza/i.test(p||'');
/* percorsi da considerare nel controllo scheda: consulenza 12/24 mesi (40/50%), 3K fisso, 3K +10% — NON finanziaria/mastermind/academy */
const isConsScheda = p=> /Consulenza/i.test(p||'') && !/Finanziaria/i.test(p||'');
const isAttivo = s=> /^Attivo/i.test(s||'');   /* "Attivo e pagante" e "Attivo non pagante" contano come attivi */

/* ============================ CALCOLI ============================ */
function cById(id){return state.clienti.find(c=>c.id===id);}
function quotaOf(id){const c=cById(id);return c&&c.quota!=null?c.quota:0.5;}

function sumMov(pred){return state.movimenti.filter(pred).reduce((s,m)=>s+(+m.importo||0),0);}
function vendutoCli(id){return sumMov(m=>m.clienteId===id&&m.tipo==='Venduto');}
function fatturatoCli(id){return sumMov(m=>m.clienteId===id&&m.tipo==='Fatturato');}
function incassatoCli(id){return sumMov(m=>m.clienteId===id&&m.tipo==='Incassato')-sumMov(m=>m.clienteId===id&&m.tipo==='Rimborso');}
function erogatoCli(id){return state.erogato.filter(e=>e.clienteId===id).reduce((s,e)=>s+(+e.erogato||0),0);}
function daFatturareCli(id){return erogatoCli(id)-fatturatoCli(id);}  /* da fatturare = erogato - fatturato */
function residuoCli(id){return fatturatoCli(id)-incassatoCli(id);}  /* da incassare = fatturato - incassato */
function incassatoLast(id,days){const lim=new Date();lim.setDate(lim.getDate()-days);
  const f=m=>m.clienteId===id&&new Date(m.data)>=lim;
  return sumMov(m=>f(m)&&m.tipo==='Incassato')-sumMov(m=>f(m)&&m.tipo==='Rimborso');}
function staPagando(id){return incassatoLast(id,60)>0;}
const DEPOSITO=6100;
function primoIncasso(id){
  const c=cById(id);
  const inc=state.movimenti.filter(m=>m.clienteId===id&&m.tipo==='Incassato'&&(+m.importo)>0)
    .sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  if(c&&isConsScheda(c.percorsoAttuale)){   // consulenza: primo incasso che supera il deposito
    let cum=0;for(const m of inc){cum+=(+m.importo||0);if(cum>DEPOSITO)return m.data;}
    return null;
  }
  return inc.length?inc[0].data:null;
}
function giorniFirmaIncasso(id){const c=cById(id);const p=primoIncasso(id);if(!c||!c.dataFirma||!p)return null;return daysBetween(c.dataFirma,p);}
function giorniFirmaPartenza(id){const c=cById(id);if(!c||!c.dataFirma||!c.dataInizio)return null;return daysBetween(c.dataFirma,c.dataInizio);}
function dataAcq(c){return c.dataFirma||c.dataInizio||null;}

/* erogato di una riga (se ci sono i MOLD ricalcola, altrimenti usa il valore salvato) */
/* erogato mostrato/sommato = valore salvato (storia congelata). Il ricalcolo dai MOLD
   avviene solo al salvataggio di una riga (nuova o modificata). */
function erogatoRiga(e){return +e.erogato||0;}
function erogatoDaMold(cli,mp,mm){
  if(mp==null||mm==null||mp===''||mm==='')return null;
  const inc=(+mm)-(+mp);return inc*quotaOf(cli)*(1+IVA());  /* anche negativo: riduce il totale */
}

/* filtri multi-scelta: array vuoto = tutti */
function inF(arr,val){return !arr||arr.length===0||arr.includes(val);}
function clientePassa(c,f){
  return inF(f.vend,c.venditore)&&inF(f.cons,c.consulente)&&inF(f.dt,c.direttoreTecnico)&&inF(f.perc,c.percorsoAttuale)&&inF(f.stato,c.stato);
}
function clientiFiltrati(f){return state.clienti.filter(c=>clientePassa(c,f));}
/* movimento passa? (consulente dal cliente) */
function movPassa(m,f){const c=cById(m.clienteId);if(!c)return false;
  return inF(f.vend,c.venditore)&&inF(f.cons,c.consulente)&&inF(f.dt,c.direttoreTecnico)&&inF(f.perc,c.percorsoAttuale)&&inF(f.stato,c.stato);}
/* riga erogato passa? (consulente dalla RIGA) */
function eroPassa(e,f){const c=cById(e.clienteId);if(!c)return false;
  return inF(f.vend,c.venditore)&&inF(f.cons,e.consulente)&&inF(f.dt,c.direttoreTecnico)&&inF(f.perc,c.percorsoAttuale)&&inF(f.stato,c.stato);}

/* somme mensili back end */
function eroMese(k,f){return state.erogato.filter(e=>mkey(e.mese)===k&&eroPassa(e,f)).reduce((s,e)=>s+erogatoRiga(e),0);}
function fatRicMese(k,f){return sumMov(m=>mkey(m.data)===k&&m.tipo==='Fatturato'&&/^Incasso ricorrente/.test(m.riferimento)&&movPassa(m,f));}
function incRicMese(k,f){return sumMov(m=>mkey(m.data)===k&&m.tipo==='Incassato'&&/^Incasso ricorrente/.test(m.riferimento)&&movPassa(m,f))
                              -sumMov(m=>mkey(m.data)===k&&m.tipo==='Rimborso'&&/^Incasso ricorrente/.test(m.riferimento)&&movPassa(m,f));}
function vendutoMese(k,f){return sumMov(m=>mkey(m.data)===k&&m.tipo==='Venduto'&&movPassa(m,f));}
function fatTotMese(k,f){return sumMov(m=>mkey(m.data)===k&&m.tipo==='Fatturato'&&movPassa(m,f));}
function incTotMese(k,f){return sumMov(m=>mkey(m.data)===k&&m.tipo==='Incassato'&&movPassa(m,f))
                              -sumMov(m=>mkey(m.data)===k&&m.tipo==='Rimborso'&&movPassa(m,f));}
function nuoviMese(k,f){return clientiFiltrati(f).filter(c=>mkey(dataAcq(c))===k).length;}

/* stato filtri dashboard (array = multi-scelta) */
let F={vend:[],cons:[],dt:[],perc:[],stato:[]};
let dashYear=2026, controlMonth=mkey(new Date().toISOString()), statsMonth=mkey(new Date().toISOString());
let schedaClienteId = (state.clienti[0]||{}).id || '';

/* ---- menu a spunte multiple ---- */
let openFilter=null, currentTab='dashboard';

function regFilters(){FILTERS.F=F;FILTERS.CF=CF;FILTERS.mov=movFilter;FILTERS.ero=eroFilter;}
const SCOPE_RENDER={F:'dashboard',CF:'clienti',mov:'movimenti',ero:'erogato'};
function multiSel(scope,key,label,list,labelFn){
  const arr=FILTERS[scope][key]||[]; const id=scope+'_'+key; const open=openFilter===id;
  const lf=labelFn||(x=>x);

  panel+=(list||[]).map(o=>`<label onclick="event.stopPropagation()"><input type="checkbox" value="${esc(o)}" ${arr.includes(o)?'checked':''} onchange="fToggle('${scope}','${key}',this.value)"> ${esc(lf(o))}</label>`).join('');
  return `<div><label>${esc(label)}</label><div class="ms ${open?'open':''}">
    <div class="ms-box" onclick="event.stopPropagation();fOpen('${id}')"><b>${esc(summ)}</b><span class="car">▾</span></div>
    <div class="ms-panel">${panel}</div></div></div>`;
}
function monthList(list,field){return [...new Set((list||[]).map(x=>mkey(x[field])).filter(Boolean))].sort().reverse();}
function sortA(a){return [...(a||[])].sort((x,y)=>String(x).localeCompare(String(y),'it'));}
function clientiIds(){return sortA(state.clienti.map(c=>c.id));}
function fOpen(id){openFilter=(openFilter===id?null:id);render(SCOPE_RENDER[id.split('_')[0]]);}

function fClear(scope,key){FILTERS[scope][key].length=0;render(SCOPE_RENDER[scope]);}

/* ============================ DASHBOARD ============================ */
function renderDashboard(){
  const L=state.liste, el=document.getElementById('view-dashboard');
  const months=[...Array(12)].map((_,i)=>dashYear+'-'+String(i+1).padStart(2,'0'));
  const allMonths=[]; for(const y of [2025,2026,2027])for(let m=1;m<=12;m++)allMonths.push(y+'-'+String(m).padStart(2,'0'));
  const ero=k=>eroMese(k,F), fat=k=>fatRicMese(k,F), inc=k=>incRicMese(k,F);
  const prog=k=>{let s=0;for(const mm of allMonths){if(mm>k)break;s+=ero(mm)-inc(mm);}return s;};
  const cf=clientiFiltrati(F);
  const backAtt=cf.filter(c=>isAttivo(c.stato)&&isBack(c.percorsoAttuale));
  const paganti=backAtt.filter(c=>staPagando(c.id));
  const giorni=cf.filter(c=>isBack(c.percorsoAttuale)&&giorniFirmaIncasso(c.id)!=null).map(c=>giorniFirmaIncasso(c.id));
  const giorniMed=giorni.length?Math.round(giorni.reduce((a,b)=>a+b,0)/giorni.length):null;
  const incTot=cf.reduce((s,c)=>s+incassatoCli(c.id),0);
  const daIncassare=cf.reduce((s,c)=>s+residuoCli(c.id),0);

  const kpi=(lbl,val,cls='')=>`<div class="card kpi ${cls}"><div class="lbl">${lbl}</div><div class="val ${String(val).length>9?'sm':''}">${val}</div></div>`;

  let html=`<h2>Dashboard</h2>
  <div class="filters">
    ${multiSel('F','vend','Venditore',sortA(L.venditori))}
    ${multiSel('F','cons','Consulente',sortA(L.consulenti))}
    ${multiSel('F','dt','Direttore Tecnico',sortA(L.dts))}
    ${multiSel('F','perc','Percorso',sortA(L.percorsi))}
    ${multiSel('F','stato','Stato',L.stati)}
  </div>
  <div class="grid kpis">
    ${kpi('Clienti (filtro)',fmtN.format(cf.length))}
    ${kpi('Attivi',fmtN.format(cf.filter(c=>isAttivo(c.stato)).length),'good')}
    ${kpi('Back end attivi',fmtN.format(backAtt.length))}
    ${kpi('Di cui paganti (60gg)',fmtN.format(paganti.length),'good')}
    ${kpi('% paganti',pct(backAtt.length?paganti.length/backAtt.length:null))}
    ${kpi('Non paganti',fmtN.format(backAtt.length-paganti.length),(backAtt.length-paganti.length)?'alert':'')}
    ${kpi('Giorni medi firma→1° inc.',giorniMed==null?'n/d':giorniMed,giorniMed!=null&&giorniMed<90?'good':(giorniMed!=null?'alert':''))}
    ${kpi('Da incassare (fatt. − inc.)',money(daIncassare))}
    ${kpi('LTV medio',money(cf.length?incTot/cf.length:0))}
  </div>

  <h3>Andamento mensile (totali) — 
    <select onchange="dashYear=+this.value;renderDashboard()" style="width:auto;display:inline-block">
      ${[2025,2026,2027].map(y=>`<option ${y===dashYear?'selected':''}>${y}</option>`).join('')}
    </select></h3>
  <div class="tbl-wrap freeze"><table><thead><tr><th>Voce</th>${months.map(k=>`<th>${MONTHS[+k.slice(5)-1]}</th>`).join('')}<th>TOT ${dashYear}</th></tr></thead><tbody>`;
  const rowM=(lbl,fn,fmt,cls='')=>{let tot=0;let cells=months.map(k=>{const v=fn(k);tot+=v;return `<td>${fmt(v)}</td>`;}).join('');
    return `<tr class="${cls}"><td>${lbl}</td>${cells}<td>${fmt(tot)}</td></tr>`;};
  const vM=k=>vendutoMese(k,F), eM=k=>eroMese(k,F), fM=k=>fatTotMese(k,F), iM=k=>incTotMese(k,F);
  html+=rowM('Nuovi clienti',k=>nuoviMese(k,F),v=>fmtN.format(v));
  html+=rowM('VENDUTO',vM,v=>money(v),'');
  html+=rowM('EROGATO',eM,v=>money(v),'');
  html+=rowM('FATTURATO',fM,v=>money(v),'');
  html+=rowM('INCASSATO',iM,v=>money(v),'');
  html+=rowM('Da fatturare (ero−fatt)',k=>eM(k)-fM(k),v=>money(v));
  html+=rowM('Da incassare (fatt−inc)',k=>fM(k)-iM(k),v=>money(v));
  html+=`</tbody></table></div>
  <div class="card" style="margin-top:12px"><div class="chart-box"><canvas id="chMonth"></canvas></div></div>`;

  // conversione
  const entrati=cf.filter(c=>c.percorsoIniziale&&!isBack(c.percorsoIniziale));
  const conv=entrati.filter(c=>isBack(c.percorsoAttuale));
  html+=`<h3>Conversione front → back end</h3><div class="grid kpis">
    ${kpi('Entrati dal front end',fmtN.format(entrati.length))}
    ${kpi('Passati al back end',fmtN.format(conv.length))}
    ${kpi('% conversione',pct(entrati.length?conv.length/entrati.length:null))}
  </div><p class="note">Il "percorso iniziale" (in Clienti) indica da dove è partito ogni cliente. Impostalo dove serve per far funzionare il funnel.</p>`;

  // statistiche per consulente
  html+=`<h3>Statistiche consulenti — 
    <input type="month" value="${statsMonth}" style="width:auto" onchange="statsMonth=this.value;renderDashboard()"></h3>
  <p class="note">"Totali/Attivi/Paganti": clienti del consulente (attivi = stato che inizia con "Attivo"; paganti = incasso negli ultimi 60 gg). "Gg firma→part." e "Gg firma→1°": medie calcolate <b>solo sui clienti attivi</b> (i fermati/conclusi non le sporcano) di quanto ci mette a far partire e a farsi pagare la prima fattura oltre i 6.100 €. "Erogato/Incassato mese": del mese scelto. "Medi/cliente": erogato e incassato di sempre diviso il numero di clienti ATTIVI.</p>`;
  // incassato del mese per consulente (una passata sui movimenti)
  const incMeseCons={};
  state.movimenti.forEach(m=>{ if(mkey(m.data)!==statsMonth)return; const cc=cById(m.clienteId); if(!cc)return;
    const v=m.tipo==='Incassato'?(+m.importo||0):(m.tipo==='Rimborso'?-(+m.importo||0):0);
    if(v)incMeseCons[cc.consulente||'—']=(incMeseCons[cc.consulente||'—']||0)+v; });
  html+=`<div class="tbl-wrap freeze"><table><thead><tr><th>Consulente</th><th>Clienti totali</th><th>Clienti attivi</th><th>Paganti (60gg)</th><th>Gg medi firma→part.</th><th>Gg medi firma→1°</th><th>Erogato mese</th><th>Incassato mese</th><th>Erogato medio/cliente</th><th>Incassato medio/cliente</th></tr></thead><tbody>`;
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  (state.liste.consulenti||[]).forEach(cons=>{
    const cs=state.clienti.filter(c=>c.consulente===cons); if(!cs.length)return;
    const csAtt=cs.filter(c=>isAttivo(c.stato));
    const attivi=csAtt.length;
    const paganti=cs.filter(c=>staPagando(c.id)).length;
    const aPart=avg(csAtt.map(c=>giorniFirmaPartenza(c.id)).filter(x=>x!=null));   // solo attivi
    const aInc=avg(csAtt.map(c=>giorniFirmaIncasso(c.id)).filter(x=>x!=null));     // solo attivi (di fatto: attivi già oltre 6.100 €)
    const eMese=state.erogato.filter(e=>e.consulente===cons&&mkey(e.mese)===statsMonth).reduce((s,e)=>s+erogatoRiga(e),0);
    const iMese=incMeseCons[cons]||0;
    const eTot=cs.reduce((s,c)=>s+erogatoCli(c.id),0), iTot=cs.reduce((s,c)=>s+incassatoCli(c.id),0);
    html+=`<tr><td><b>${esc(cons)}</b></td><td>${cs.length}</td><td>${attivi}</td><td>${paganti}</td>
      <td>${aPart==null?'–':aPart}</td><td>${aInc==null?'–':aInc}</td>
      <td>${money(eMese)}</td><td>${money(iMese)}</td>
      <td>${money(attivi?eTot/attivi:0)}</td><td>${money(attivi?iTot/attivi:0)}</td></tr>`;
  });
  html+=`</tbody></table></div>`;

  // controllo compilazione scheda (solo consulenza 12/24 mesi, 3K fisso, 3K+10% — no finanziaria/mastermind/academy)
  html+=`<h3>Controllo compilazione scheda</h3>
  <div class="toolbar"><span class="hint">Mese da controllare:</span>
    <input type="month" value="${controlMonth}" style="width:auto" onchange="controlMonth=this.value;renderDashboard()"></div>
  <div class="tbl-wrap freeze"><table><thead><tr><th>Consulente</th><th>Consulenza attivi</th><th>Schede nel mese</th><th>Mancanti</th></tr></thead><tbody>`;
  let tA=0,tC=0;
  (state.liste.consulenti||[]).forEach(cons=>{
    const att=state.clienti.filter(c=>c.consulente===cons&&isAttivo(c.stato)&&isConsScheda(c.percorsoAttuale)).length;
    const comp=state.erogato.filter(e=>e.consulente===cons&&mkey(e.mese)===controlMonth).length;
    tA+=att;tC+=comp;const man=att-comp;
    html+=`<tr><td>${esc(cons)}</td><td>${att}</td><td>${comp}</td><td>${man>0?`<span class="pill no">${man}</span>`:man}</td></tr>`;
  });
  html+=`<tr class="tot"><td>TOTALE</td><td>${tA}</td><td>${tC}</td><td>${tA-tC}</td></tr></tbody></table></div>`;

  // LTV per offerta
  html+=`<h3>LTV per offerta</h3><div class="tbl-wrap freeze"><table><thead><tr><th>Percorso</th><th>N.</th><th>Venduto</th><th>Erogato</th><th>Fatturato</th><th>Incassato (LTV)</th><th>LTV medio</th></tr></thead><tbody>`;
  let T={n:0,v:0,e:0,f:0,i:0};
  (state.liste.percorsi||[]).forEach(p=>{
    const cs=cf.filter(c=>c.percorsoAttuale===p);if(!cs.length)return;
    const v=cs.reduce((s,c)=>s+vendutoCli(c.id),0),e=cs.reduce((s,c)=>s+erogatoCli(c.id),0),
      f=cs.reduce((s,c)=>s+fatturatoCli(c.id),0),i=cs.reduce((s,c)=>s+incassatoCli(c.id),0);
    T.n+=cs.length;T.v+=v;T.e+=e;T.f+=f;T.i+=i;
    html+=`<tr><td>${esc(p)}</td><td>${cs.length}</td><td>${money(v)}</td><td>${money(e)}</td><td>${money(f)}</td><td>${money(i)}</td><td>${money(cs.length?i/cs.length:0)}</td></tr>`;

  setViewHTML(el,html);
  drawMonthChart(months);
}

    <div class="card kpi"><div class="lbl">Incassato (LTV)</div><div class="val sm">${money(incassatoCli(c.id))}</div></div>
    <div class="card kpi"><div class="lbl">Da fatturare</div><div class="val sm">${money(daFatturareCli(c.id))}</div></div>
    <div class="card kpi"><div class="lbl">Da incassare</div><div class="val sm">${money(residuoCli(c.id))}</div></div>
  </div>`;
  // tabella mensile 2025-2027
  const id=c.id;
  const vM=k=>sumMov(m=>m.clienteId===id&&m.tipo==='Venduto'&&mkey(m.data)===k);
  const eM=k=>state.erogato.filter(e=>e.clienteId===id&&mkey(e.mese)===k).reduce((s,e)=>s+erogatoRiga(e),0);
  const fM=k=>sumMov(m=>m.clienteId===id&&m.tipo==='Fatturato'&&mkey(m.data)===k);
  const iM=k=>sumMov(m=>m.clienteId===id&&m.tipo==='Incassato'&&mkey(m.data)===k)-sumMov(m=>m.clienteId===id&&m.tipo==='Rimborso'&&mkey(m.data)===k);
  const all=[];for(const y of[2025,2026,2027])for(let m=1;m<=12;m++)all.push(y+'-'+String(m).padStart(2,'0'));
  const cumAt=(fn,k)=>{let s=0;for(const mm of all){if(mm>k)break;s+=fn(mm);}return s;};
  const daFattProg=k=>cumAt(eM,k)-cumAt(fM,k);   // erogato progr. − fatturato progr.
  const daIncProg=k=>cumAt(fM,k)-cumAt(iM,k);     // fatturato progr. − incassato progr.
  html+=`<h3>Dettaglio mensile 2025 · 2026 · 2027</h3><div class="tbl-wrap freeze"><table><thead><tr>
    <th>Mese</th><th>Venduto</th><th>Erogato</th><th>Fatturato</th><th>Incassato</th><th>Da fatturare</th><th>Da incassare</th><th>Da fatt. progr.</th><th>Da inc. progr.</th></tr></thead><tbody>`;
  [2025,2026,2027].forEach(y=>{
    let yv=0,ye=0,yf=0,yi=0;
    for(let m=1;m<=12;m++){const k=y+'-'+String(m).padStart(2,'0');
      const v=vM(k),e=eM(k),f=fM(k),ic=iM(k);yv+=v;ye+=e;yf+=f;yi+=ic;
      if(v||e||f||ic)
        html+=`<tr><td>${MONTHS[m-1]} ${y}</td><td>${money(v)}</td><td>${money(e)}</td><td>${money(f)}</td><td>${money(ic)}</td><td>${money(e-f)}</td><td>${money(f-ic)}</td><td>${money(daFattProg(k))}</td><td>${money(daIncProg(k))}</td></tr>`;
    }
    html+=`<tr class="sub"><td>Totale ${y}</td><td>${money(yv)}</td><td>${money(ye)}</td><td>${money(yf)}</td><td>${money(yi)}</td><td>${money(ye-yf)}</td><td>${money(yf-yi)}</td><td>${money(daFattProg(y+'-12'))}</td><td>${money(daIncProg(y+'-12'))}</td></tr>`;
  });
  html+=`</tbody></table></div><p class="note">Mesi senza movimenti nascosti. I totali per anno considerano tutti i mesi.</p>`;
  setViewHTML(el,html);
}

/* ============================ IMPOSTAZIONI + GITHUB ============================ */
function renderImpostazioni(){
  const el=document.getElementById('view-impostazioni');const g=ghCfg();
  const listEditor=(key,label)=>`<div class="card" style="margin-bottom:10px">
    <label>${label}</label>
    <textarea rows="4" onchange="setList('${key}',this.value)">${(state.liste[key]||[]).join('\\n')}</textarea>
    <p class="hint">Una voce per riga.</p></div>`;
  el.innerHTML=`<h2>Impostazioni</h2>

  <h3>Sincronizzazione e collaborazione</h3>
  <div class="card">
    <p class="hint">Collega una repository GitHub <b>privata</b> condivisa: tutti i dispositivi collegati vedono e aggiornano gli stessi dati, con salvataggio automatico. Il token resta salvato solo in questo browser. Serve un token con permesso <b>Contents: Read and write</b> sulla repo.</p>
    <div class="form-grid">
      <div><label>Il tuo nome (autore delle modifiche)</label><input id="gh_author" value="${esc(g.author||'')}" placeholder="Es. Roberto"></div>
      <div><label>Utente / organizzazione GitHub</label><input id="gh_user" value="${esc(g.user||'')}"></div>
      <div><label>Repository (privata)</label><input id="gh_repo" value="${esc(g.repo||'')}"></div>
      <div><label>Branch</label><input id="gh_branch" value="${esc(g.branch||'main')}"></div>
      <div><label>File dati</label><input id="gh_path" value="${esc(g.path||'data.json')}"></div>
      <div class="full"><label>Token di accesso</label><input id="gh_token" type="password" value="${esc(g.token||'')}"></div>
    </div>
    <div class="toolbar" style="margin-top:10px">
      <label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="gh_auto" ${g.auto!==false?'checked':''} style="width:auto"> Salvataggio automatico</label>
      <label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="gh_admin" ${g.admin?'checked':''} style="width:auto"> Modalità amministratore (mostra la Cronologia)</label>
    </div>
    <div class="toolbar" style="margin-top:8px">
      <button class="btn" onclick="ghSaveConnect()">Salva e connetti</button>
      <button class="btn ghost" onclick="syncNow()">Sincronizza ora</button>
      <button class="btn ghost" onclick="ghForcePull()">Scarica da GitHub (sostituisci locale)</button>
      <button class="btn danger" onclick="ghDisconnect()">Disconnetti</button>
    </div>
    <p id="gh_status" class="hint"></p>
    <p class="hint">Nota: chiunque ha l'accesso può modificare i dati; la "Modalità amministratore" è una comodità (mostra la cronologia con il ripristino), non un blocco di sicurezza.</p>
  </div>

  <h3>Backup manuale</h3>
  <div class="card">
    <div class="toolbar">
      <button class="btn ghost" onclick="exportBackup()">Esporta backup (.json)</button>
      <label class="btn ghost" style="cursor:pointer">Importa backup (sostituisce)<input type="file" accept=".json" style="display:none" onchange="importBackup(this.files[0],true)"></label>
      <label class="btn ghost" style="cursor:pointer">Aggiungi clienti da file (unisce)<input type="file" accept=".json" style="display:none" onchange="importBackup(this.files[0],false)"></label>
      <button class="btn danger" onclick="resetToSeed()">Ripristina dati iniziali</button>
    </div>
    <p class="hint">"Importa backup" sostituisce tutto; "Aggiungi clienti da file" unisce senza cancellare.</p>
  </div>

  <h3>Elenchi personalizzabili</h3>
  ${listEditor('venditori','Venditori')}
  ${listEditor('consulenti','Consulenti')}
  ${listEditor('dts','Direttori Tecnici')}
  ${listEditor('percorsi','Percorsi / offerte')}
  ${listEditor('stati','Stati cliente')}
  <div class="card"><label>IVA (per il calcolo dell'erogato)</label>
    <input type="number" step="1" value="${Math.round(IVA()*100)}" onchange="state.liste.iva=(+this.value||0)/100;state._listeMod=Date.now();save();renderAll()"> %</div>
  `;
}
function setList(key,val){state.liste[key]=val.split('\\n').map(s=>s.trim()).filter(Boolean);state._listeMod=Date.now();save();renderAll();}

function exportBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='backup_incassi_rbr_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importBackup(file,replace){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(replace){if(!confirm('Sostituire TUTTI i dati con quelli del file?'))return;state=d;}
    else{ // merge clienti per id, aggiunge movimenti/erogato
      const ids=new Set(state.clienti.map(c=>c.id));
      (d.clienti||[]).forEach(c=>{if(!ids.has(c.id))state.clienti.push(c);});
      (d.movimenti||[]).forEach(m=>state.movimenti.push(m));
      (d.erogato||[]).forEach(e=>state.erogato.push(e));
    }
    state._listeMod=Date.now();ensureIds();save();renderAll();alert('Import completato.');
  }catch(e){alert('File non valido: '+e.message);}};
  r.readAsText(file);
}

/* --- GitHub: config --- */
function ghCfg(){try{return JSON.parse(localStorage.getItem(GH_KEY)||'{}');}catch(e){return{};}}
function ghSet(c){localStorage.setItem(GH_KEY,JSON.stringify(c));updateSyncBadge();}
function authorName(){return (ghCfg().author||'').trim()||'Anonimo';}
function isAdmin(){return !!ghCfg().admin;}
function autoOn(){return ghCfg().auto!==false;}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function ghApi(c){return `https://api.github.com/repos/${c.user}/${c.repo}/contents/${c.path}`;}
function ghHeaders(c){return {Authorization:'token '+c.token,Accept:'application/vnd.github+json'};}
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob((s||'').replace(/\\n/g,''))));}
function ghStatus(t){const e=document.getElementById('gh_status');if(e)e.textContent=t;}
function hhmm(){return new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});}

/* --- merge: last-writer-wins con tombstones --- */
function mergeColl(a,b,key){const m=new Map();(a||[]).forEach(r=>m.set(r[key],r));(b||[]).forEach(r=>{const e=m.get(r[key]);if(!e||(r._mod||0)>(e._mod||0))m.set(r[key],r);});return [...m.values()];}
function mergeDel(a,b){const o={clienti:{},movimenti:{},erogato:{}};['clienti','movimenti','erogato'].forEach(k=>{const m={...((a||{})[k]||{})};Object.entries(((b||{})[k])||{}).forEach(([id,t])=>{m[id]=Math.max(m[id]||0,t);});o[k]=m;});return o;}
function applyDel(arr,key,tomb){return arr.filter(r=>!(tomb[r[key]]&&tomb[r[key]]>=(r._mod||0)));}
function mergeState(a,b){
  const del=mergeDel(a._deleted,b._deleted);
  let cl=applyDel(mergeColl(a.clienti,b.clienti,'id'),'id',del.clienti);
  let mv=applyDel(mergeColl(a.movimenti,b.movimenti,'_id'),'_id',del.movimenti);
  let er=applyDel(mergeColl(a.erogato,b.erogato,'_id'),'_id',del.erogato);
  const liste=(b._listeMod||0)>(a._listeMod||0)?b.liste:a.liste;
  const lm=Math.max(a._listeMod||0,b._listeMod||0);
  return {clienti:cl,movimenti:mv,erogato:er,liste,_listeMod:lm,_deleted:del};
}
function fingerprint(d){return JSON.stringify([d.clienti,d.movimenti,d.erogato,d.liste,d._deleted]);}

/* --- sync engine --- */
let syncing=false,syncTimer=null,pollTimer=null;
function scheduleSync(){const c=ghCfg();if(!c.connected||!autoOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1200);}
async function fetchRemote(c){
  const r=await fetch(ghApi(c)+'?ref='+encodeURIComponent(c.branch)+'&_='+Date.now(),{headers:ghHeaders(c),cache:'no-store'});
  if(r.status===200){const j=await r.json();return {sha:j.sha,data:JSON.parse(b64dec(j.content))};}
  if(r.status===404)return {sha:null,data:null};
  const j=await r.json().catch(()=>({}));throw new Error(j.message||('HTTP '+r.status));
}
async function putRemote(c,sha,msg){
  const body={message:msg,content:b64enc(JSON.stringify(state)),branch:c.branch};if(sha)body.sha=sha;
  const r=await fetch(ghApi(c),{method:'PUT',headers:ghHeaders(c),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return {conflict:true};
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('HTTP '+r.status));}
  const j=await r.json();return {sha:j.content.sha};
}
function setBadge(t,cls){const b=document.getElementById('syncBadge');if(b){b.textContent=t;b.className='badge'+(cls?' '+cls:'');}}
async function syncNow(){
  const c=ghCfg();if(!c.connected)return;
  if(syncing)return;syncing=true;setBadge('Sincronizzo…','');ghStatus('Sincronizzo…');
  const fpPrima=fingerprint(state);
  try{
    for(let attempt=0;attempt<4;attempt++){
      const rem=await fetchRemote(c);
      if(rem.data)state=mergeState(state,rem.data);
      ensureIds();saveLocal();
      if(rem.data&&fingerprint(rem.data)===fingerprint(state)){ghStatus('Aggiornato ✓ '+hhmm());break;}
      const res=await putRemote(c,rem.sha,authorName()+' — '+new Date().toLocaleString('it-IT'));
      if(res.conflict){await new Promise(r=>setTimeout(r,400));continue;}
      ghStatus('Salvato ✓ '+hhmm());break;
    }
    if(fingerprint(state)!==fpPrima) renderData();  // ridisegna solo se qualcosa è cambiato (evita di resettare lo scroll)
  }catch(e){ghStatus('Errore sync: '+e.message);}
  finally{syncing=false;updateSyncBadge();}
}
async function ghSaveConnect(){
  const c={user:val('gh_user'),repo:val('gh_repo'),branch:val('gh_branch')||'main',path:val('gh_path')||'data.json',
    token:val('gh_token'),author:val('gh_author'),
    admin:document.getElementById('gh_admin')?document.getElementById('gh_admin').checked:false,
    auto:document.getElementById('gh_auto')?document.getElementById('gh_auto').checked:true};
  if(!c.user||!c.repo||!c.token){ghStatus('Compila utente, repository e token.');return;}
  ghSet({...c,connected:true});ghStatus('Connesso. Sincronizzo…');buildNav();
  await syncNow();startPoll();renderImpostazioni();
}
function ghDisconnect(){const c=ghCfg();stopPoll();ghSet({author:c.author,admin:c.admin,auto:c.auto});ghStatus('Disconnesso.');buildNav();renderAll();}
async function ghForcePull(){const c=ghCfg();if(!c.connected){ghStatus('Connetti prima GitHub.');return;}
  if(!confirm('Scaricare i dati da GitHub e sostituire quelli locali di questo dispositivo?'))return;
  try{const rem=await fetchRemote(c);if(rem.data){state=rem.data;ensureIds();saveLocal();renderData();ghStatus('Scaricato da GitHub ✓ '+hhmm());}
    else ghStatus('Nessun dato ancora sulla repo.');}catch(e){ghStatus('Errore: '+e.message);}}
function startPoll(){stopPoll();if(ghCfg().connected)pollTimer=setInterval(()=>{if(!syncing&&document.visibilityState!=='hidden')syncNow();},12000);}
function stopPoll(){if(pollTimer)clearInterval(pollTimer);pollTimer=null;}
function updateSyncBadge(){const b=document.getElementById('syncBadge');if(!b)return;const c=ghCfg();
  if(c.connected&&c.repo){b.textContent='Sync ✓'+(autoOn()?' auto':'');b.className='badge ok';}
  else{b.textContent='Solo questo dispositivo';b.className='badge';}}

/* --- cronologia + ripristino (solo amministratore) --- */
async function renderCronologia(){
  const el=document.getElementById('view-cronologia');if(!el)return;const c=ghCfg();
  if(!isAdmin()){el.innerHTML='<h2>Cronologia</h2><p class="note">Sezione riservata al solo amministratore. Attivala in Impostazioni.</p>';return;}
  if(!c.connected){el.innerHTML='<h2>Cronologia</h2><p class="note">Collega prima GitHub in Impostazioni.</p>';return;}
  el.innerHTML='<h2>Cronologia modifiche</h2><p class="note">Carico…</p>';
  try{
    const url=`https://api.github.com/repos/${c.user}/${c.repo}/commits?path=${encodeURIComponent(c.path)}&sha=${encodeURIComponent(c.branch)}&per_page=40&_=${Date.now()}`;
    const r=await fetch(url,{headers:ghHeaders(c),cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const list=await r.json();
    let html='<h2>Cronologia modifiche</h2><p class="note">Ogni riga è un salvataggio. "Ripristina" riporta i dati a come erano dopo quel salvataggio (la versione attuale resta comunque in cronologia).</p><div class="tbl-wrap freeze"><table><thead><tr><th>Data e ora</th><th>Autore / nota</th><th></th></tr></thead><tbody>';
    list.forEach((cm,idx)=>{
      const d=new Date(cm.commit.author.date).toLocaleString('it-IT');
      const msg=esc(cm.commit.message||'');
      html+=`<tr><td>${d}</td><td>${msg}${idx===0?' <span class="pill si">attuale</span>':''}</td><td>${idx===0?'':`<button class="btn ghost sm" onclick="restoreVersion('${cm.sha}')">Ripristina</button>`}</td></tr>`;
    });
    html+='</tbody></table></div>';el.innerHTML=html;
  }catch(e){el.innerHTML='<h2>Cronologia modifiche</h2><p class="note">Errore: '+esc(e.message)+'</p>';}
}
async function restoreVersion(sha){
  const c=ghCfg();if(!c.connected)return;
  if(!confirm('Ripristinare i dati a questa versione? La versione attuale resterà comunque nella cronologia.'))return;
  try{
    const r=await fetch(`${ghApi(c)}?ref=${sha}`,{headers:ghHeaders(c),cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();state=JSON.parse(b64dec(j.content));ensureIds();saveLocal();
    const cur=await fetchRemote(c);
    await putRemote(c,cur.sha,'Ripristino versione precedente — '+authorName()+' — '+new Date().toLocaleString('it-IT'));
    renderData();alert('Ripristino completato.');renderCronologia();
  }catch(e){alert('Errore ripristino: '+e.message);}
}

/* ============================ INIT ============================ */
ensureIds();regFilters();buildNav();renderAll();go('dashboard');
if(ghCfg().connected){startPoll();syncNow();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ghCfg().connected&&!syncing)syncNow();});
</script>
